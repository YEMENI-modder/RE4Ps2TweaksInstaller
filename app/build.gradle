plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yemeni.re4tweaksinstaller'
    compileSdk 34

    defaultConfig {
        applicationId "com.yemeni.re4tweaksinstaller"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        // Chaquopy needs to know which ABIs to bundle Python's native
        // libs for. arm64-v8a covers virtually all modern Android
        // phones; armeabi-v7a is kept too
        // for older/budget devices some users may test on.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // pycdlib is pure Python (no native extensions), so no
            // special wheel handling needed beyond listing it here.
            pip {
                install "pycdlib"
            }

            // The build machine's Python (3.11) differs from the Python bundled
            // into the APK (Chaquopy default), so .pyc precompilation can't run
            // and only produced warnings. Python sources are compiled on device.
            pyc {
                src false
                pip false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // This is the key hookup for our folder layout: everything under
    // src/main/python/ (installer_core.py, iso_handler.py, FilesUsed.py,
    // RemoveWeaponSwap.py, dados/*) gets bundled into the APK and
    // extracted by Chaquopy at first run into the app's private files
    // directory, where Python can read/write it normally.
    sourceSets {
        main {
            python {
                srcDirs = ["src/main/python"]
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    // MainActivity imports kotlinx.coroutines directly, so declare it explicitly.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
