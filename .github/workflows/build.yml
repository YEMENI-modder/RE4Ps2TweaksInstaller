
name: Build APK

on:
  push:
    branches:
      - Claude-edit

  pull_request:
    branches:
      - Claude-edit

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # لا يعمل إلا على Claude-edit
    if: github.ref == 'refs/heads/Claude-edit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Release ZIP
        shell: bash
        run: |
          releaseDir="release"
          zipPath="RE4TweaksInstaller-debug-apk.zip"
          buildDir="app/build/outputs/apk/debug"

          if [ ! -f "$buildDir/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not found."
            exit 1
          fi

          rm -rf "$releaseDir"
          rm -f "$zipPath"

          mkdir -p "$releaseDir"

          cp "$buildDir/app-debug.apk" "$releaseDir/"

          cd "$releaseDir"
          zip -9 "../$zipPath" app-debug.apk
          cd ..

          if [ ! -f "$zipPath" ]; then
            echo "Error: Failed to create ZIP."
            exit 1
          fi

          echo "ZIP created successfully:"
          echo "$zipPath"

      - name: Check Release
        id: release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/build-test" >/dev/null 2>&1; then
            echo "Release 'Build test' exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release 'Build test' does not exist yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: github.event_name != 'pull_request' && steps.release.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-test \
            RE4TweaksInstaller-debug-apk.zip \
            --title "Build test" \
            --notes "Latest automatic build from commit $GITHUB_SHA"

      - name: Update Release
        if: github.event_name != 'pull_request' && steps.release.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload build-test \
            RE4TweaksInstaller-debug-apk.zip \
            --clobber

          gh release edit build-test \
            --title "Build test" \
            --notes "Latest automatic build from commit $GITHUB_SHA"

      - name: Show Download Link
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          repo="$GITHUB_REPOSITORY"
          downloadUrl="https://github.com/$repo/releases/download/build-test/RE4TweaksInstaller-debug-apk.zip"

          echo ""
          echo "========================================"
          echo "BUILD COMPLETED!"
          echo ""
          echo "Download:"
          echo "$downloadUrl"
          echo ""
          echo "Release:"
          echo "https://github.com/$repo/releases/tag/build-test"
          echo "========================================"
